name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  php-syntax:
    name: PHP Syntax Check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" \
            -print0 | xargs -0 -n1 php -l

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer run lint

  phpstan:
    name: PHPStan (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer run stan

  plugin-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify readme.txt Stable tag matches plugin header Version
        run: |
          README_VER=$(grep -m1 -oP '(?<=Stable tag: )\S+' readme.txt)
          HEADER_VER=$(grep -m1 -oP 'Version:\s*\K\S+' beplus-metadata-ai-analyzer.php)
          echo "readme.txt Stable tag: $README_VER"
          echo "Plugin header Version: $HEADER_VER"
          if [ "$README_VER" != "$HEADER_VER" ]; then
            echo "::error::Version mismatch — readme.txt says $README_VER, plugin header says $HEADER_VER"
            exit 1
          fi

  wordpress-compatibility:
    name: WordPress ${{ matrix.wordpress }} Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ['7.1.1']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
      - name: Activate plugin on WordPress ${{ matrix.wordpress }}
        run: |
          mkdir -p /tmp/wp-compat
          php wp-cli.phar core download --version=${{ matrix.wordpress }} --path=/tmp/wp-compat
          php wp-cli.phar config create --path=/tmp/wp-compat --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1
          php wp-cli.phar core install --path=/tmp/wp-compat --url=http://localhost --title=Test --admin_user=admin --admin_password=password --admin_email=admin@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-compat/wp-content/plugins/beplus-metadata-ai-analyzer
          php wp-cli.phar plugin activate beplus-metadata-ai-analyzer --path=/tmp/wp-compat
